[project]
name = "ninjaonepy"
version = "0.3.0"
description = "Unofficial Python client for the NinjaOne RMM API v2"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdullah 'AJ' Khan", email = "aj@ajkhan.me" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.9",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/ak9999/ninjaonepy"
Documentation = "https://app.ninjarmm.com/apidocs/"

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking (moves type-only imports into TYPE_CHECKING)
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
